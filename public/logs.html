<!doctype html>
<html lang="en" style="background:#0a0a0f;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSIM — Live Logs</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/fonts.css">
<!-- Live Logs window — the /api/logs/stream SSE consumer, opened as its own popup by the
     bottom-left z-20 launcher (window.open('/logs.html')). Re-skinned to the masterpiece
     "portal" design language (DESIGN_SYSTEM §2.13/§2.14 · livelogs-overlay ds:1218-1250):
     canonical purple tokens, Inter chrome, a rich glass header/footer frame over a flat
     monospace log surface. Self-contained + OFFLINE — vendored fonts.css only, no CDN.
     The EventSource stream + all rendering/filter logic below is PRESERVED VERBATIM; only
     the chrome (colours, borders, radii, header/footer frame) changed. -->
<style>
  :root{
    /* Canonical masterpiece token palette (channel triples + resolved chrome colours). */
    --brand:#9333ea; --brand-d:#7e22ce; --brand-l:#c084fc;
    --bg:#0a0a0f; --bg-2:#0d0c14; --bar:#121119; --raised:#1e1c29;
    --line:#2c2937; --line-strong:#46424f;
    --fg:#e8e8ee; --dim:#928da3; --faint:#6b6678;
    --info:#9ad0ff; --warn:#f59e0b; --error:#f43f5e; --debug:#6b6678; --ts:#5a5670; --ok:#34d399;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(147,51,234,.14), transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
  }

  /* ── Rich header frame (glass over the brand bloom) ─────────────────────────── */
  header{
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;
    background:
      linear-gradient(180deg, rgba(147,51,234,.06), transparent),
      color-mix(in srgb, var(--bar) 86%, transparent);
    backdrop-filter:blur(14px) saturate(1.3);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -18px #000;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;color:#f7f7fa;letter-spacing:.2px}
  /* Brand mark — the real SSIM shield (same asset as the dashboard/portals), not the old diamond glyph. */
  .mark{width:16px;height:16px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(147,51,234,.6));flex-shrink:0}
  .brand .sep{color:var(--line-strong);font-weight:500}
  .brand .name{color:var(--dim);font-weight:500;font-size:12px}
  .spacer{flex:1}

  /* ── Level filter chips (masterpiece .chip toggle language) ─────────────────── */
  .filters{display:flex;gap:5px}
  .chip{
    font-size:11px;font-weight:600;padding:4px 10px;border:1px solid var(--line);
    border-radius:10px;background:var(--raised);color:var(--dim);cursor:pointer;user-select:none;
    transition:background .12s, color .12s, border-color .12s;
  }
  .chip:hover{border-color:var(--line-strong);color:#c2bfd0}
  .chip.on{color:#fff;border-color:transparent;background:rgba(255,255,255,.06)}
  .chip.lv-error.on{background:rgba(244,63,94,.16);color:#fda4af;border-color:rgba(244,63,94,.35)}
  .chip.lv-warn.on{background:rgba(245,158,11,.16);color:#fbbf6b;border-color:rgba(245,158,11,.35)}
  .chip.lv-info.on{background:rgba(154,208,255,.14);color:#9ad0ff;border-color:rgba(154,208,255,.32)}
  .chip.lv-debug.on{background:rgba(146,141,163,.18);color:#c2bfd0;border-color:rgba(146,141,163,.35)}

  /* ── Search field (masterpiece .field language) ─────────────────────────────── */
  input.search{
    background:var(--bg-2);border:1px solid var(--line);border-radius:10px;color:var(--fg);
    font-size:12px;padding:6px 10px;width:180px;outline:none;transition:border-color .12s, box-shadow .12s;
  }
  input.search::placeholder{color:var(--faint)}
  input.search:hover:not(:focus){border-color:var(--line-strong)}
  input.search:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(147,51,234,.5)}

  /* ── Action buttons (.btn language) ─────────────────────────────────────────── */
  button.act{
    font-size:11px;font-weight:600;padding:6px 11px;border:1px solid var(--line);border-radius:10px;
    background:var(--raised);color:var(--fg);cursor:pointer;transition:background .12s, border-color .12s, box-shadow .12s;
  }
  button.act:hover{border-color:var(--line-strong)}
  button.act.on{
    background:linear-gradient(135deg,var(--brand-l),var(--brand-d));border-color:transparent;color:#fff;
    box-shadow:0 0 14px -4px rgba(147,51,234,.6);
  }
  .count{font-size:11px;color:var(--dim);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}

  /* ── Flat monospace log surface ─────────────────────────────────────────────── */
  #log{
    flex:1;overflow-y:auto;padding:8px 0;
    font-family:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    font-size:12.5px;line-height:1.55;
  }
  .row{display:flex;gap:12px;padding:1.5px 14px;white-space:pre-wrap;word-break:break-word}
  .row:hover{background:rgba(147,51,234,.06)}
  .row .ts{color:var(--ts);flex-shrink:0;font-variant-numeric:tabular-nums}
  .row .lv{flex-shrink:0;width:44px;font-weight:700;text-transform:uppercase;font-size:10px;padding-top:2px;letter-spacing:.5px}
  .row.error .lv{color:var(--error)} .row.error .msg{color:#fecdd3}
  .row.warn  .lv{color:var(--warn)}  .row.warn .msg{color:#fde2b3}
  .row.info  .lv{color:var(--info)}
  .row.debug{opacity:.7} .row.debug .lv{color:var(--debug)}
  .msg{flex:1;color:#d4d1e0}
  .empty{color:var(--dim);text-align:center;padding:48px;font-size:13px}

  /* ── Footer meta strip (masterpiece livelogs-overlay footer ds:1245-1248) ───── */
  footer{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 14px;border-top:1px solid var(--line);
    background:color-mix(in srgb, var(--bar) 86%, transparent);
    font-size:11px;color:var(--faint);flex-shrink:0;
  }
  footer .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#57536a}
</style>
</head>
<body>
  <header>
    <span class="brand"><img class="mark" src="/assets/image-Photoroom.png" alt="">SSIM <span class="sep">·</span> <span class="name">Live Logs</span></span>
    <span class="spacer"></span>
    <span class="filters" id="filters">
      <span class="chip lv-error on" data-lv="error">error</span>
      <span class="chip lv-warn on"  data-lv="warn">warn</span>
      <span class="chip lv-info on"  data-lv="info">info</span>
      <span class="chip lv-debug"    data-lv="debug">debug</span>
    </span>
    <input class="search" id="search" placeholder="filter text…" spellcheck="false">
    <button class="act on" id="follow" title="auto-scroll to newest">▾ Follow</button>
    <button class="act" id="clear">Clear</button>
    <span class="count" id="count">0</span>
  </header>
  <div id="log"><div class="empty" id="empty">Waiting for log activity…</div></div>
  <footer>
    <span>Live backend log · newest at bottom</span>
    <span class="mono">buffer 3 000 lines</span>
  </footer>

<script>
  var logEl = document.getElementById('log');
  var emptyEl = document.getElementById('empty');
  var followBtn = document.getElementById('follow'), countEl = document.getElementById('count');
  var searchEl = document.getElementById('search');
  var MAX_ROWS = 3000;            // DOM cap → never grows unbounded
  var follow = true;
  var levels = { error:true, warn:true, info:true, debug:false };
  var search = '';
  var total = 0;

  function hms(iso){ var d = new Date(iso); return isNaN(d) ? '' : d.toTimeString().slice(0,8); }
  function visible(level, msg){
    if (!levels[level]) return false;
    if (search && msg.toLowerCase().indexOf(search) === -1) return false;
    return true;
  }
  function refreshCount(){
    var shown = logEl.querySelectorAll('.row:not(.hidden)').length;
    countEl.textContent = shown + (shown !== total ? ' / ' + total : '') + ' lines';
  }
  function addLine(line){
    if (emptyEl){ emptyEl.remove(); emptyEl = null; }
    var lv = (line.level || 'info').toLowerCase();
    if (lv !== 'error' && lv !== 'warn' && lv !== 'debug') lv = 'info';
    var row = document.createElement('div');
    row.className = 'row ' + lv + (visible(lv, (line.msg||'').toLowerCase()) ? '' : ' hidden');
    row.dataset.lv = lv; row.dataset.msg = (line.msg || '').toLowerCase();
    var ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = hms(line.t);
    var lvl = document.createElement('span'); lvl.className = 'lv'; lvl.textContent = lv;
    var msg = document.createElement('span'); msg.className = 'msg'; msg.textContent = line.msg || '';
    row.appendChild(ts); row.appendChild(lvl); row.appendChild(msg);
    if (row.classList.contains('hidden')) row.style.display = 'none';
    logEl.appendChild(row); total++;
    while (logEl.children.length > MAX_ROWS){ logEl.removeChild(logEl.firstChild); total--; }
    if (follow) logEl.scrollTop = logEl.scrollHeight;
    refreshCount();
  }
  function reapply(){
    var rows = logEl.querySelectorAll('.row');
    for (var i=0;i<rows.length;i++){
      var r = rows[i];
      var vis = visible(r.dataset.lv, r.dataset.msg);
      r.style.display = vis ? '' : 'none';
      r.classList.toggle('hidden', !vis);   // keep class ⇔ display in sync so refreshCount() stays honest
    }
    if (follow) logEl.scrollTop = logEl.scrollHeight;
    refreshCount();
  }

  // filters
  document.getElementById('filters').addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if (!c) return;
    var lv = c.dataset.lv; levels[lv] = !levels[lv]; c.classList.toggle('on', levels[lv]); reapply();
  });
  searchEl.addEventListener('input', function(){ search = searchEl.value.trim().toLowerCase(); reapply(); });
  followBtn.addEventListener('click', function(){ follow = !follow; followBtn.classList.toggle('on', follow); if (follow) logEl.scrollTop = logEl.scrollHeight; });
  document.getElementById('clear').addEventListener('click', function(){ logEl.innerHTML=''; total=0; refreshCount(); });
  // pause follow when the user scrolls up; resume when back at the bottom
  logEl.addEventListener('scroll', function(){
    var atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 24;
    if (follow !== atBottom){ follow = atBottom; followBtn.classList.toggle('on', follow); }
  });

  function connect(){
    var es = new EventSource('/api/logs/stream');
    es.onmessage = function(ev){ try { addLine(JSON.parse(ev.data)); } catch(e){} };
    // EventSource reconnects automatically (server sends retry: 3000); the old
    // dot/"live" connection indicator was removed on owner request (2026-07-08).
  }
  connect();
</script>
</body>
</html>
