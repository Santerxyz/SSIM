<!doctype html>
<html lang="en" style="background:#0a0a0f;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>SSIM</title>
<!-- Boot splash shown by the Tauri shell while the backend starts. Loaded via the Tauri asset
     protocol (WebviewUrl::App) so WebView2 renders it reliably — a top-level data: URL renders
     blank WHITE in WebView2. The SSIM logo (assets/logo.png, bundled in the same frontendDist)
     sits centre with an animated ring orbiting around it. Inline CSS so the dark canvas paints
     with no load gap; only the (local, bundled) logo image streams in. -->
<style>
  html,body{height:100%;margin:0}
  body{
    background: radial-gradient(1100px 700px at 50% -12%, rgba(147,51,234,.16), #0a0a0f 60%);
    color:#e8e8f0; font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .box{ text-align:center; }
  /* Logo + orbiting loader ring. The badge is already circular; the ring spins JUST OUTSIDE it. */
  .logo-wrap{ position:relative; width:128px; height:128px; margin:0 auto 26px; }
  .logo{ position:absolute; inset:12px; width:104px; height:104px; border-radius:50%;
    filter:drop-shadow(0 0 20px rgba(147,51,234,.55)); animation:breathe 3s ease-in-out infinite; }
  .ring{ position:absolute; inset:0; border-radius:50%;
    border:3px solid transparent; border-top-color:#c084fc; border-right-color:#9333ea;
    animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
  .msg{ font-size:14px; color:#c9c6d6; letter-spacing:.2px; }
  .sub{ font-size:12px; color:#6b6878; margin-top:.45rem; min-height:1em; }
  /* Update progress bar — hidden until the shell reports an auto-update is in flight. */
  .track{ display:none; width:240px; height:5px; margin:14px auto 0; border-radius:99px;
    background:rgba(255,255,255,.08); overflow:hidden; }
  .bar{ width:0%; height:100%; border-radius:99px;
    background:linear-gradient(90deg,#9333ea,#c084fc); transition:width .3s ease; }
  @media (prefers-reduced-motion:reduce){ .ring,.logo{ animation:none; } .bar{ transition:none; } }
</style>
</head>
<body>
  <div class="box">
    <div class="logo-wrap">
      <div class="ring"></div>
      <img class="logo" src="assets/logo.png" alt="SSIM">
    </div>
    <!-- id="msg"/id="sub"/id="bar" + window.__ssimUpd are driven by the Tauri shell
         (src-tauri/src/lib.rs) to narrate a long auto-update; these MUST stay in sync with it. -->
    <div id="msg" class="msg">Starting SSIM…</div>
    <div id="sub" class="sub"></div>
    <div id="track" class="track"><div id="bar" class="bar"></div></div>
  </div>
  <script>
    // Single entry point the shell calls per update phase: set the message, the sub-line, and
    // (when a number is given) reveal + fill the progress bar. Centralised here so lib.rs stays
    // a one-liner eval per phase. Guarded everywhere because the splash may already be torn down.
    window.__ssimUpd = function (msg, sub, pct) {
      var m = document.getElementById('msg'), s = document.getElementById('sub'),
          t = document.getElementById('track'), b = document.getElementById('bar');
      if (m && msg != null) m.textContent = msg;
      if (s && sub != null) s.textContent = sub;
      if (typeof pct === 'number') {
        if (t) t.style.display = 'block';
        if (b) b.style.width = Math.max(0, Math.min(100, pct)) + '%';
      }
    };
  </script>
</body>
</html>
