<!doctype html>
<html lang="en" style="background:#0a0a0f;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>SSIM</title>
<!-- Boot splash shown by the Tauri shell while the backend starts. Loaded via the Tauri asset
     protocol (WebviewUrl::App) so WebView2 renders it reliably — a top-level data: URL renders
     blank WHITE in WebView2. The SSIM logo (assets/image-Photoroom.png, bundled in the same frontendDist)
     sits centre with an animated ring orbiting around it. Inline, self-contained, OFFLINE — the
     dark canvas paints with no load gap and only the (local, bundled) logo image streams in.

     Re-skinned to the masterpiece .portal design (DESIGN_SYSTEM §2.13). The prototype-only state
     switcher (.portal-proto-states / .pstate) and the mock #splash-version line are DROPPED — the
     REAL start / downloading-update / ready states are driven by the Tauri shell via window.__ssimUpd
     (src-tauri/src/lib.rs). The ids #msg / #sub / #track / #bar and window.__ssimUpd are the frozen
     contract the shell targets and are preserved VERBATIM. -->
<style>
  /* ── Masterpiece design tokens (inlined, self-contained — no CDN, portal loads before the DS CSS) ── */
  :root{
    --brand-rgb: 147 51 234;      /* #9333ea primary */
    --brand-d-rgb: 126 34 206;    /* #7e22ce deep    */
    --brand-l-rgb: 192 132 252;   /* #c084fc light   */
    --slate-200: 221 219 230; --slate-300: 194 191 208; --slate-400: 146 141 163;
    --slate-500: 107 102 120; --slate-600: 70 66 79;    --slate-700: 44 41 55;
    --slate-800: 30 28 41;    --slate-900: 18 17 25;    --slate-950: 10 10 15;
    --success-rgb: 52 211 153; --danger-rgb: 244 63 94;
    --grad-brand: linear-gradient(135deg, rgb(var(--brand-rgb)), rgb(var(--brand-d-rgb)));
    --glass-border: rgb(var(--slate-700) / .7);
    --elev-3: 0 28px 80px -24px rgb(var(--brand-rgb) / .32), 0 12px 40px rgb(0 0 0 / .62);
    --r-modal: 16px;
    --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
  }
  html,body{ height:100%; margin:0; }
  body{
    /* .portal radial brand backdrop (DESIGN_SYSTEM §2.13, ds:380-381) */
    background: radial-gradient(1100px 640px at 50% -12%, rgb(var(--brand-rgb) / .16), rgb(var(--slate-950)) 60%);
    color: rgb(var(--slate-200));
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }

  /* ── .portal-card — 400px rich gradient card, edge-light, elevation (ds:383-386) ── */
  .portal-card{
    width:400px; max-width:calc(100vw - 32px); position:relative; border-radius:var(--r-modal);
    background: linear-gradient(180deg, rgb(var(--slate-800) / .5), rgb(var(--slate-900))), rgb(var(--slate-900));
    border:1px solid var(--glass-border); box-shadow:var(--elev-3);
    padding:30px 28px 30px; text-align:center;
  }
  .portal-card::before{ content:''; position:absolute; inset:0 0 auto 0; height:1px;
    background: linear-gradient(90deg, transparent, rgb(var(--brand-l-rgb) / .6), transparent); }

  /* ── Logo + orbiting loader ring (portal-logo-wrap.loading + portal-halo, ds:387-391). The badge
       is already circular; the ring spins JUST OUTSIDE it, matching the splash sizing (ds:792-794). ── */
  .logo-wrap{ position:relative; width:128px; height:128px; margin:0 auto 26px; }
  .logo{ position:absolute; inset:14px; width:100px; height:100px; border-radius:50%;
    filter:drop-shadow(0 0 20px rgb(var(--brand-rgb) / .55)); animation:breathe 3s ease-in-out infinite; }
  .ring{ position:absolute; inset:0; border-radius:50%;
    border:3px solid transparent; border-top-color:rgb(var(--brand-l-rgb)); border-right-color:rgb(var(--brand-rgb));
    animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
  @keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  .msg{ font-size:var(--fs-14); color:rgb(var(--slate-300)); letter-spacing:.2px; }
  .sub{ font-size:var(--fs-12); color:rgb(var(--slate-500)); margin-top:.45rem; min-height:1em; }

  /* ── Update progress bar — hidden until the shell reports an auto-update is in flight
       (.portal-track / .portal-bar, ds:398-399). ── */
  .track{ display:none; width:260px; max-width:100%; height:5px; margin:16px auto 0; border-radius:99px;
    background:rgb(255 255 255 / .08); overflow:hidden; }
  .bar{ width:0%; height:100%; border-radius:99px;
    background:var(--grad-brand); transition:width .3s ease; }

  @media (prefers-reduced-motion:reduce){
    /* Reduced-motion users still need a liveness cue on a slow (first-run / post-update) boot.
       Swap the rotation for an opacity pulse (no translate/scale/rotate — within WCAG guidance)
       and colour all four borders so the non-spinning ring reads as a full ring, not a lopsided arc. */
    .ring{ animation:pulse 1.6s ease-in-out infinite;
      border-top-color:rgb(var(--brand-l-rgb)); border-right-color:rgb(var(--brand-l-rgb));
      border-bottom-color:rgb(var(--brand-rgb)); border-left-color:rgb(var(--brand-rgb)); }
    .logo{ animation:none; }
    .bar{ transition:none; }
  }
</style>
</head>
<body>
  <div class="portal-card">
    <div class="logo-wrap">
      <div class="ring"></div>
      <img class="logo" src="assets/image-Photoroom.png" alt="SSIM">
    </div>
    <!-- id="msg"/id="sub"/id="bar" + window.__ssimUpd are driven by the Tauri shell
         (src-tauri/src/lib.rs) to narrate a long auto-update; these MUST stay in sync with it. -->
    <div id="msg" class="msg">Starting SSIM…</div>
    <div id="sub" class="sub"></div>
    <div id="track" class="track"><div id="bar" class="bar"></div></div>
  </div>
  <script>
    // Single entry point the shell calls per update phase: set the message, the sub-line, and
    // (when a number is given) reveal + fill the progress bar. Centralised here so lib.rs stays
    // a one-liner eval per phase. Guarded everywhere because the splash may already be torn down.
    window.__ssimUpd = function (msg, sub, pct) {
      var m = document.getElementById('msg'), s = document.getElementById('sub'),
          t = document.getElementById('track'), b = document.getElementById('bar');
      if (m && msg != null) m.textContent = msg;
      if (s && sub != null) s.textContent = sub;
      if (typeof pct === 'number') {
        if (t) t.style.display = 'block';
        if (b) b.style.width = Math.max(0, Math.min(100, pct)) + '%';
      }
    };
  </script>
</body>
</html>
