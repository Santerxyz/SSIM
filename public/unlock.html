<!doctype html>
<html lang="en" class="dark" style="background:#0a0a0f;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSIM — Unlock Vault</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/fonts.css">
<style>
  /* ── Masterpiece tokens (self-contained subset — portals load before the dashboard CSS) ── */
  :root{
    color-scheme: dark;
    --brand-rgb: 147 51 234;     /* #9333ea primary  */
    --brand-d-rgb: 126 34 206;   /* #7e22ce deep/hover */
    --brand-l-rgb: 192 132 252;  /* #c084fc light    */
    --slate-200: 221 219 230; --slate-300: 194 191 208; --slate-400: 146 141 163;
    --slate-500: 107 102 120;  --slate-600: 70 66 79;   --slate-700: 44 41 55;
    --slate-800: 30 28 41;     --slate-900: 18 17 25;   --slate-950: 10 10 15;
    --bg-2: 13 12 20;
    --border-strong: 70 66 79;
    --success-rgb: 52 211 153;
    --danger-rgb: 244 63 94; --danger-d-rgb: 225 29 72;
    --grad-brand:  linear-gradient(135deg, rgb(var(--brand-rgb)), rgb(var(--brand-d-rgb)));
    --glow-sm: 0 0 14px -4px rgb(var(--brand-rgb) / .55);
    --glow-md: 0 0 24px -6px rgb(var(--brand-rgb) / .60);
    --border-1: rgb(var(--slate-700));
    --border-2: rgb(var(--border-strong));
    --surface-0: rgb(var(--slate-950));
    --surface-sunken: rgb(var(--bg-2));
    --glass-border: rgb(var(--slate-700) / .7);
    --ring-soft: rgb(var(--brand-rgb) / .5);
    --elev-1: 0 1px 2px rgb(0 0 0 / .40);
    --elev-3: 0 28px 80px -24px rgb(var(--brand-rgb) / .32), 0 12px 40px rgb(0 0 0 / .62);
    --dur-fast: 120ms; --dur: 160ms; --ease: cubic-bezier(.2,.8,.2,1);
    --r-input: 10px; --r-btn: 12px; --r-modal: 16px;
    --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    color: rgb(var(--slate-200));
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
    /* .portal radial brand backdrop (ds:381) */
    background-color: rgb(var(--slate-950));
    background-image: radial-gradient(1100px 640px at 50% -12%, rgb(var(--brand-rgb) / .16), rgb(var(--slate-950)) 60%);
    background-attachment: fixed;
  }

  /* ── .portal-card (ds:383-386) — rich gradient frame, top edge-light ── */
  .card {
    width: 400px; max-width: calc(100vw - 32px); position:relative;
    border-radius: var(--r-modal);
    background: linear-gradient(180deg, rgb(var(--slate-800) / .5), rgb(var(--slate-900))), rgb(var(--slate-900));
    border:1px solid var(--glass-border); box-shadow: var(--elev-3);
    padding: 30px 28px 24px;
  }
  .card::before{ content:''; position:absolute; inset:0 0 auto 0; height:1px;
    background: linear-gradient(90deg, transparent, rgb(var(--brand-l-rgb) / .6), transparent); }

  /* ── Logo halo / spinner (ds:387-403). Class names kept as legacy JS targets:
       #logoWrap toggles `.loading`; `.ring` is the halo→spinner; `.logo` is the shield. ── */
  .hero { margin-bottom: 4px; }
  .logo-wrap { position:relative; width:92px; height:92px; margin:0 auto 12px; }
  .ring { position:absolute; inset:0; border-radius:50%; border:2.5px solid rgb(var(--brand-l-rgb) / .18); }
  .logo { position:absolute; inset:10px; width:72px; height:72px;
    filter: drop-shadow(0 0 16px rgb(var(--brand-rgb) / .5)); }
  /* Idle: pulsing purple halo glow on the shield. On submit (.loading) the ring becomes a spinning accent arc — the loader. */
  .logo-wrap.loading .ring { border-color:transparent; border-top-color: rgb(var(--brand-l-rgb));
    border-right-color: rgb(var(--brand-rgb)); animation: lspin .9s linear infinite; }
  .logo-wrap:not(.loading) .logo { animation: halo 2.6s ease-in-out infinite; }
  @keyframes lspin { to { transform: rotate(360deg); } }
  @keyframes halo { 0%,100%{ filter: drop-shadow(0 0 10px rgb(var(--brand-rgb) / .45)); }
    50%{ filter: drop-shadow(0 0 22px rgb(var(--brand-rgb) / .7)); } }

  .cap { display:block; text-align:center; color: rgb(var(--slate-400)); font-size: var(--fs-11);
    letter-spacing:.5px; text-transform:uppercase; }
  h1 { font-size: var(--fs-16); font-weight:700; text-align:center; margin: 6px 0 0; color:#fff; }
  p.sub { color: rgb(var(--slate-400)); font-size: var(--fs-13); line-height:1.5; text-align:center; margin: 4px 0 18px; }

  /* ── Fields (ds:232-240) ── */
  label { display:block; font-size: var(--fs-12); font-weight:600; color: rgb(var(--slate-400)); margin: 12px 0 6px; }
  input {
    width:100%; padding: .625rem .75rem; border-radius: var(--r-input);
    background-color: var(--surface-sunken); border:1px solid var(--border-2);
    color: rgb(var(--slate-200)); font-size: var(--fs-14); outline:none;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) var(--ease);
  }
  input::placeholder { color: rgb(var(--slate-600)); }
  input:hover:not(:focus) { border-color: rgb(var(--slate-600)); }
  input:focus { border-color: rgb(var(--brand-rgb)); box-shadow: 0 0 0 2px var(--ring-soft); }

  /* ── Primary CTA = rich gradient (.btn-primary, ds:199-201) ── */
  button {
    width:100%; margin-top: 18px; padding: .625rem 1rem; border:1px solid transparent;
    border-radius: var(--r-btn); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
    color:#fff; font-size: var(--fs-14); font-weight:700; line-height:1; white-space:nowrap;
    background-image: var(--grad-brand);
    box-shadow: inset 0 1px 0 rgb(var(--brand-l-rgb) / .35), var(--glow-sm), var(--elev-1);
    transition: background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur) var(--ease), filter var(--dur) var(--ease);
  }
  button:hover:not(:disabled){ filter: brightness(1.06);
    box-shadow: inset 0 1px 0 rgb(var(--brand-l-rgb) / .45), var(--glow-md), var(--elev-1); }
  button:active:not(:disabled){ transform: translateY(1px) scale(.99); }
  button:disabled { opacity:.5; cursor:not-allowed; }

  /* ── Messages / warnings (ds:395-397) ── */
  .msg { margin-top:14px; font-size: var(--fs-13); min-height:18px; text-align:center; }
  .msg.err { color: rgb(var(--danger-rgb)); }
  .msg.ok  { color: rgb(var(--brand-l-rgb)); }
  .warn { margin-top:14px; font-size: var(--fs-11); color:#caa45a; line-height:1.5; }

  /* In-button loading spinner (ds:400): shown the moment a correct password is submitted and kept
     spinning through the unlock → "starting SSIM" wait, so there's motion, never a static "Unlocking…" line. */
  .spin { display:inline-block; width:14px; height:14px; vertical-align:-2px; margin-right:8px;
    border:2px solid rgb(255 255 255 / .35); border-top-color:#fff; border-radius:50%;
    animation:lspin .7s linear infinite; }
  /* Motion opt-out hook (body.no-motion), NOT the OS flag — Windows "animation effects: off"
     froze the unlock spinner/halo on the operator's machine (see ssim-ui.css REDUCED MOTION note). */
  body.no-motion *, body.no-motion *::before, body.no-motion *::after {
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
  }
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="hero">
      <div class="logo-wrap" id="logoWrap"><div class="ring"></div><img class="logo" src="/assets/image-Photoroom.png" alt="SSIM"></div>
      <span class="cap">Secure Vault</span>
    </div>
    <h1 id="title">Unlock your vault</h1>
    <p class="sub" id="sub">Enter your Master Password to start SSIM.</p>

    <label for="pw" id="lblpw">Master Password</label>
    <input id="pw" type="password" autofocus autocomplete="off" spellcheck="false">

    <div id="confirmWrap" style="display:none">
      <label for="confirm">Confirm Master Password</label>
      <input id="confirm" type="password" autocomplete="off" spellcheck="false">
    </div>

    <!-- Orphan mode (S18): shown only when the server refuses an empty-vault create over an
         orphaned farm (409 orphaned:true). The operator must tick the acknowledgement to send
         createEmptyAnyway and deliberately create a NEW empty vault. -->
    <div id="orphanWrap" style="display:none">
      <label class="ack" for="orphanAck" style="display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#caa45a;line-height:1.5;margin:14px 0 0;cursor:pointer">
        <input id="orphanAck" type="checkbox" style="width:auto;margin-top:2px;flex:0 0 auto">
        <span>I understand: a NEW EMPTY vault will be created and my registered accounts stay credential-less until vault.enc is restored.</span>
      </label>
    </div>

    <button id="btn" type="submit">Unlock</button>
    <div class="msg" id="msg"></div>
    <div class="warn" id="warn" style="display:none">
      First run: this sets your Master Password. Encryption is required and there is
      <b>no recovery</b> — keep it safe.
    </div>
  </form>

<script>
  var firstRun = false;
  var orphanMode = false; // S18: set when the server refuses an empty-vault create over an orphaned farm.
  var el = function (id) { return document.getElementById(id); };

  // S18: the server refused to silently create an empty vault (vault.enc missing, accounts.json
  // survives). Switch the page into a deliberate, destructive "create NEW empty vault" mode instead
  // of the bare error line — the only client path that can send createEmptyAnyway.
  function enterOrphanMode(errText) {
    orphanMode = true;
    el('title').textContent = 'Vault file missing';
    el('sub').textContent = errText;
    el('confirmWrap').style.display = 'block';
    el('warn').style.display = 'none';
    el('orphanWrap').style.display = 'block';
    var btn = el('btn');
    btn.textContent = 'Create NEW empty vault';
    btn.style.background = 'var(--danger-rgb)';
    btn.style.backgroundImage = 'none';
    btn.style.backgroundColor = 'rgb(var(--danger-d-rgb))';
    btn.style.boxShadow = 'inset 0 1px 0 rgb(255 255 255 / .10), var(--elev-1)';
  }

  // Keep-alive ping (legacy Edge-window heartbeat; the Tauri shell now owns shutdown).
  function ping() { try { fetch('/api/app/ping').catch(function () {}); } catch (e) {} }
  ping();
  setInterval(ping, 4000);

  // H-ACC-066: the state probe decides "create" vs "unlock". A transient fetch failure used to be
  // swallowed silently, leaving firstRun=false — the page then looked like an unlock but a first-run
  // POST would CREATE a vault from a single unconfirmed entry. Retry 3× (700ms apart); if the state
  // is still unknown, tell the operator and mark the probe unresolved so submit re-runs it before posting.
  var stateResolved = false;
  function applyFirstRun() {
    el('title').textContent = 'Set your Master Password';
    el('sub').textContent = 'Create a Master Password to encrypt this vault.';
    el('confirmWrap').style.display = 'block';
    el('btn').textContent = 'Create vault';
    el('warn').style.display = 'block';
  }
  function probeState(attemptsLeft) {
    return fetch('/api/vault/state').then(function (r) { return r.json(); }).then(function (d) {
      stateResolved = true;
      firstRun = !d.exists;
      if (firstRun) applyFirstRun();
      return true;
    }).catch(function () {
      if (attemptsLeft > 1) {
        return new Promise(function (resolve) {
          setTimeout(function () { resolve(probeState(attemptsLeft - 1)); }, 700);
        });
      }
      var msg = el('msg');
      msg.className = 'msg err';
      msg.textContent = 'Could not determine vault state — check that SSIM is still starting, then try again.';
      return false;
    });
  }
  probeState(3);

  el('form').addEventListener('submit', function (e) {
    e.preventDefault();
    // H-ACC-066: never post while the vault state is unknown (a swallowed probe failure would
    // otherwise let an unlock attempt CREATE a vault). Re-run the probe first; only submit once
    // the state is resolved so firstRun (and thus the confirm requirement) is decided from truth.
    if (!stateResolved) {
      var m = el('msg'); m.className = 'msg'; m.textContent = 'Checking vault state…';
      probeState(3).then(function (ok) { if (ok) doSubmit(); });
      return;
    }
    doSubmit();
  });

  function doSubmit() {
    var password = el('pw').value;
    var confirm = (firstRun || orphanMode) ? el('confirm').value : undefined;
    var msg = el('msg');
    msg.className = 'msg';
    if (!password) { msg.className = 'msg err'; msg.textContent = 'A Master Password is required.'; return; }
    if ((firstRun || orphanMode) && password !== confirm) { msg.className = 'msg err'; msg.textContent = 'The passwords do not match.'; return; }
    // S18: creating a NEW empty vault over an orphaned farm is destructive — require the acknowledgement.
    if (orphanMode && el('orphanAck').checked !== true) {
      msg.className = 'msg err';
      msg.textContent = 'Tick the acknowledgement to proceed, or restore vault.enc and restart SSIM.';
      return;
    }

    var btn = el('btn');
    var origLabel = btn.textContent;
    btn.disabled = true;
    el('logoWrap').classList.add('loading'); // ring spins around the logo while we unlock
    // Spinner in the button conveys progress — no static "Working…" text.
    btn.innerHTML = '<span class="spin"></span>' + ((firstRun || orphanMode) ? 'Creating vault…' : 'Unlocking…');
    msg.className = 'msg'; msg.textContent = '';
    fetch('/api/vault/unlock', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password, confirm: confirm, createEmptyAnyway: (orphanMode && el('orphanAck').checked === true) ? true : undefined }),
    }).then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); }).then(function (resp) {
      var d = resp.d;
      if (d && d.ok) {
        // Correct password → keep the spinner running through the hand-off to the
        // dashboard. The shell will NOT re-navigate (one-shot per spawn), so we must
        // wait for PROOF the full app has rebound the port before we reload — a blind
        // fixed timer would reload onto an unbound port (connection-refused) on a slow
        // boot (large farms). Discriminator: only the portal fabricates vaultLocked:true;
        // the full app's /api/system/status has no vaultLocked key, so "status answers
        // without vaultLocked:true" ⇔ the dashboard is live. (H-ACC-067)
        btn.innerHTML = '<span class="spin"></span>' + (d.created ? 'Vault created — starting…' : 'Starting SSIM…');
        msg.className = 'msg'; msg.textContent = '';
        var startedAt = Date.now();
        var waitForApp = function () {
          fetch('/api/system/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
            if (s && s.vaultLocked !== true) { location.replace('/'); return; }
            if (Date.now() - startedAt > 60000) { btn.innerHTML = '<span class="spin"></span>Still starting — large farms can take a minute…'; }
            setTimeout(waitForApp, 500);
          }).catch(function () {
            if (Date.now() - startedAt > 60000) { btn.innerHTML = '<span class="spin"></span>Still starting — large farms can take a minute…'; }
            setTimeout(waitForApp, 500);
          });
        };
        setTimeout(waitForApp, 900);
      } else {
        btn.disabled = false;
        el('logoWrap').classList.remove('loading');
        // S18: the server refuses an empty-vault create over an orphaned farm (409 orphaned:true).
        // Enter the deliberate destructive mode rather than dead-ending on the bare error line.
        if (resp.status === 409 && d && d.orphaned === true) {
          enterOrphanMode((d && d.error) || 'The vault file (vault.enc) is missing.');
          msg.className = 'msg'; msg.textContent = '';
          el('pw').value = ''; el('pw').focus();
        } else {
          btn.innerHTML = origLabel;
          msg.className = 'msg err';
          msg.textContent = (d && d.error) || 'Unlock failed.';
          el('pw').value = ''; el('pw').focus();
        }
      }
    }).catch(function () {
      btn.disabled = false; btn.innerHTML = origLabel;
      el('logoWrap').classList.remove('loading');
      msg.className = 'msg err';
      msg.textContent = 'Could not reach SSIM. Please try again.';
    });
  }
</script>
</body>
</html>
