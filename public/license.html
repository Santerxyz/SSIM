<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSIM – Activate License</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/vendor/fonts.css" />
  <style>
    :root { --bg:#0a0a0f; --card:#121119; --line:#2c2937; --brand:#9333ea; --brand-d:#7e22ce; --brand-l:#c084fc; --text:#e8e8ee; --muted:#9a96a8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:
        radial-gradient(700px 400px at 80% -10%, rgba(147,51,234,.18), transparent 60%),
        radial-gradient(600px 400px at -10% 110%, rgba(147,51,234,.12), transparent 60%), var(--bg);
      color:var(--text); font-family:'Inter',system-ui,Segoe UI,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
      border-radius:.5rem; padding:32px; box-shadow:0 0 40px -12px rgba(147,51,234,.5); }
    .logo { width:56px; height:56px; border-radius:50%;
      box-shadow:0 0 18px -6px rgba(147,51,234,.65); }
    .logo img { width:100%; height:100%; display:block; }
    h1 { font-size:18px; margin:14px 0 2px; }
    .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    input { width:100%; background:#1e1c29; border:1px solid #3a3647; color:var(--text);
      border-radius:.375rem; padding:11px 12px; font-size:15px; letter-spacing:.5px;
      font-family:ui-monospace,monospace; text-transform:uppercase; outline:none; }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(147,51,234,.25); }
    button { width:100%; margin-top:16px; background:var(--brand); color:#fff; border:0;
      border-radius:.375rem; padding:12px; font-size:15px; font-weight:600; cursor:pointer;
      box-shadow:0 0 18px -6px rgba(147,51,234,.65); transition:background .15s, transform .05s; }
    button:hover { background:var(--brand-d); }
    button:active { transform:scale(.99); }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:14px; font-size:13.5px; min-height:18px; }
    .msg.err { color:#fb7185; }
    .msg.ok { color:#34d399; }
    .msg.info { color:var(--brand-l); }
    .hwid { margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
      font-size:11px; color:#6f6b7e; word-break:break-all; }
    .spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff; border-radius:50%; animation:r .7s linear infinite; vertical-align:-2px; margin-right:6px; }
    @keyframes r { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="logo"><img src="/assets/logo.png" alt="SSIM" /></div>
    <h1>Activate SSIM</h1>
    <p class="sub">Please enter your license key to unlock the Santer Steam Inventory Manager.</p>

    <label for="key">License key</label>
    <input id="key" placeholder="SSIM-XXXX-XXXX-XXXX-XXXX" autocomplete="off" autofocus
      pattern="[A-Za-z0-9-]+" spellcheck="false" />

    <button id="btn" type="submit">Activate</button>
    <div class="msg" id="msg"></div>

    <div class="hwid" id="hwid"></div>
  </form>

  <script>
    const $ = (id) => document.getElementById(id);
    const msg = $('msg'), btn = $('btn'), key = $('key');

    // Keep the live field value in sync with the uppercase glyphs the CSS shows,
    // so what the user re-edits matches what will be sent (caret position preserved).
    key.addEventListener('input', () => {
      const p = key.selectionStart;
      key.value = key.value.toUpperCase();
      try { key.setSelectionRange(p, p); } catch (_) {}
    });

    fetch('/api/license/state').then(r => r.json()).then(d => {
      if (d.hwid) $('hwid').textContent = 'Device ID (HWID): ' + d.hwid;
    }).catch(() => {});

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      // The CSS text-transform:uppercase only restyles the glyphs; key.value stays
      // as typed. Server keys are uppercase-only (Crockford-base32) and looked up
      // case-sensitively, so upcase the read value to match what the user sees.
      const value = key.value.trim().toUpperCase();
      if (!value) { setMsg('err', 'Please enter your license key.'); return; }
      btn.disabled = true;
      setMsg('info', '<span class="spin"></span> Checking license…');
      try {
        const res = await fetch('/api/license/activate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: value }),
        });
        const d = await res.json().catch(() => ({}));
        if (res.ok && d.ok) {
          setMsg('ok', '✓ Activated' + (d.tier ? ' (' + d.tier + ')' : '') + ' – starting SSIM…');
          // The portal hands over to the real app on the same port; reload into it.
          setTimeout(() => location.reload(), 2500);
        } else {
          setMsg('err', '✗ ' + (d.error || 'Activation failed.'));
          btn.disabled = false;
        }
      } catch (err) {
        setMsg('err', '✗ Server unreachable.');
        btn.disabled = false;
      }
    });

    function setMsg(kind, html) { msg.className = 'msg ' + kind; msg.innerHTML = html; }
  </script>
</body>
</html>
